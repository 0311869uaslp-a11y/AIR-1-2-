<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>
    <form action="formulario" method="get">
        Nombre: <input type="text" name="nombre"><br>
        Apellidos: <input type="text" name="apellidos"><br>
        Edad:
        <select name="edad">
            <option value="menor de 18">Menor de 18</option>
            <option value="18-30">18-30</option>
            <option value="31-50">31-50</option>
            <option value="51+">51+</option>
        </select><br>
        Hobbies:<br>
        <input type="checkbox" name="hobbies" value="Deporte">Deporte<br>
        <input type="checkbox" name="hobbies" value="Música">Música<br>
        <input type="checkbox" name="hobbies" value="Lectura">Lectura<br>
        <br>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
